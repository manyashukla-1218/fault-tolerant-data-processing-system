<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Fault-Tolerant Data Processing System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0c10;
    --bg-grid: #0d1015;
    --panel: #12151c;
    --panel-raised: #161a23;
    --border: #232834;
    --border-soft: #1b1f29;
    --text: #eef1f7;
    --muted: #7c8599;
    --muted-soft: #565f73;
    --accent: #7c9eff;
    --accent-dim: #4a5f99;
    --green: #4ade9e;
    --red: #ff7a7a;
    --amber: #ffb454;
    --radius: 14px;
    --radius-sm: 8px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background:
      radial-gradient(circle at 15% 0%, rgba(124,158,255,0.06), transparent 45%),
      radial-gradient(circle at 85% 15%, rgba(74,222,158,0.04), transparent 40%),
      var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  header {
    padding: 26px 32px 22px;
    border-bottom: 1px solid var(--border-soft);
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .header-icon {
    width: 38px; height: 38px;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--accent), #5b6fd9);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    box-shadow: 0 4px 18px rgba(124,158,255,0.25);
    flex-shrink: 0;
  }
  header h1 {
    margin: 0; font-size: 19px; font-weight: 700;
    font-family: 'Space Grotesk', sans-serif;
    letter-spacing: -0.01em;
  }
  header p {
    margin: 3px 0 0; color: var(--muted); font-size: 12.5px;
    font-family: 'IBM Plex Mono', monospace;
    letter-spacing: 0.01em;
  }
  header p .arrow { color: var(--accent-dim); }
  .layout {
    display: grid;
    grid-template-columns: 380px 1fr;
    gap: 22px;
    padding: 24px 32px 40px;
    align-items: start;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px;
  }
  .panel h2 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--muted);
    margin: 0 0 16px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .panel h2::before {
    content: '';
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent);
  }
  label {
    display: block; font-size: 11.5px; color: var(--muted-soft);
    margin: 14px 0 6px; font-weight: 500;
    text-transform: uppercase; letter-spacing: 0.04em;
  }
  input[type=text], textarea {
    width: 100%;
    background: #0a0c11;
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: var(--radius-sm);
    padding: 10px 12px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    transition: border-color 0.15s ease;
  }
  input[type=text]:focus, textarea:focus {
    outline: none;
    border-color: var(--accent-dim);
  }
  textarea { resize: vertical; min-height: 120px; line-height: 1.55; }
  .checkbox-row {
    display: flex; align-items: center; gap: 9px; margin-top: 16px;
    padding: 10px 12px;
    background: #0a0c11;
    border: 1px solid var(--border-soft);
    border-radius: var(--radius-sm);
  }
  .checkbox-row input {
    width: 15px; height: 15px; accent-color: var(--accent);
  }
  .checkbox-row label {
    margin: 0; text-transform: none; letter-spacing: normal; color: var(--muted);
    font-size: 12.5px; font-weight: 400;
  }
  button {
    margin-top: 18px;
    width: 100%;
    padding: 11px;
    border: none;
    border-radius: var(--radius-sm);
    background: var(--accent);
    color: #0a0c11;
    font-weight: 600;
    cursor: pointer;
    font-size: 13.5px;
    font-family: 'Inter', sans-serif;
    transition: transform 0.1s ease, box-shadow 0.15s ease, background 0.15s ease;
  }
  button:hover { background: #93aeff; box-shadow: 0 4px 16px rgba(124,158,255,0.25); }
  button:active { transform: scale(0.98); }
  button.secondary {
    background: transparent; border: 1px solid var(--border); color: var(--muted);
    font-weight: 500;
  }
  button.secondary:hover { background: var(--panel-raised); box-shadow: none; color: var(--text); }
  .result-box {
    margin-top: 16px;
    padding: 12px 14px;
    border-radius: var(--radius-sm);
    font-size: 11.5px;
    font-family: 'IBM Plex Mono', monospace;
    white-space: pre-wrap;
    display: none;
    line-height: 1.5;
    border: 1px solid transparent;
    max-height: 220px;
    overflow-y: auto;
  }
  .presets { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .presets button {
    width: auto; margin: 0; padding: 6px 11px; font-size: 11px;
    background: var(--panel-raised); color: var(--muted); font-weight: 500;
    border: 1px solid var(--border-soft);
  }
  .presets button:hover { color: var(--text); border-color: var(--border); box-shadow: none; }

  .tabs { display: flex; gap: 4px; margin-bottom: 18px; border-bottom: 1px solid var(--border-soft); }
  .tab-btn {
    width: auto; margin: 0 0 -1px 0; padding: 9px 4px; font-size: 13px;
    background: transparent; border: none; border-bottom: 2px solid transparent;
    color: var(--muted); border-radius: 0; font-weight: 500;
    margin-right: 22px;
  }
  .tab-btn:hover { background: transparent; box-shadow: none; color: var(--text); }
  .tab-btn.active { color: var(--text); border-bottom-color: var(--accent); }

  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border-soft); vertical-align: top; }
  th {
    color: var(--muted-soft); font-weight: 600; text-transform: uppercase;
    font-size: 10px; letter-spacing: 0.06em;
  }
  tr:hover td { background: rgba(124,158,255,0.03); }
  td.mono {
    font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--muted);
    max-width: 240px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .badge {
    padding: 3px 9px; border-radius: 20px; font-size: 10px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.03em; display: inline-block;
  }
  .badge.processed { background: rgba(74,222,158,0.12); color: var(--green); }
  .badge.received { background: rgba(255,180,84,0.12); color: var(--amber); }
  .badge.failed_write { background: rgba(255,122,122,0.12); color: var(--red); }
  .badge.rejected { background: rgba(255,122,122,0.12); color: var(--red); }

  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 20px; }
  .stat-card {
    background: var(--panel-raised); border: 1px solid var(--border-soft);
    border-radius: var(--radius-sm); padding: 16px 18px;
    position: relative; overflow: hidden;
  }
  .stat-card::after {
    content: ''; position: absolute; top: 0; left: 0; width: 3px; height: 100%;
    background: var(--accent-dim);
  }
  .stat-card .num {
    font-size: 24px; font-weight: 700; font-family: 'Space Grotesk', sans-serif;
    letter-spacing: -0.01em;
  }
  .stat-card .label { font-size: 11px; color: var(--muted); margin-top: 3px; }

  .filters { display: flex; gap: 8px; margin-bottom: 16px; }
  .filters input { flex: 1; }
  .filters button { flex-shrink: 0; }
  .empty-state {
    color: var(--muted-soft); font-size: 13px; padding: 34px 20px; text-align: center;
    font-family: 'IBM Plex Mono', monospace;
  }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 8px; }
</style>
</head>
<body>

<header>
  <div class="header-icon">⚙️</div>
  <div>
    <h1>Fault-Tolerant Data Processing System</h1>
    <p>ingest <span class="arrow">→</span> normalize <span class="arrow">→</span> dedup <span class="arrow">→</span> aggregate</p>
  </div>
</header>

<div class="layout">
  <!-- LEFT: Submission panel -->
  <div class="panel">
    <h2>Submit Raw Event</h2>
    <label>Source / Client ID</label>
    <input type="text" id="source" value="client_A">

    <label>Payload (JSON)</label>
    <textarea id="payload">{
  "metric": "value",
  "amount": "1200",
  "timestamp": "2024/01/01"
}</textarea>

    <div class="presets">
      <button onclick='loadPreset("clean")'>Clean payload</button>
      <button onclick='loadPreset("messy")'>Messy fields</button>
      <button onclick='loadPreset("newclient")'>Unknown client/fields</button>
      <button onclick='loadPreset("broken")'>Missing source</button>
    </div>

    <div class="checkbox-row">
      <input type="checkbox" id="simulateFailure">
      <label for="simulateFailure">Simulate DB failure mid-write</label>
    </div>

    <button onclick="submitEvent()">Submit Event</button>
    <button class="secondary" onclick="retrySame()">↻ Retry same event (test dedup)</button>

    <div id="resultBox" class="result-box"></div>
  </div>

  <!-- RIGHT: Data views -->
  <div class="panel">
    <div class="tabs">
      <button class="tab-btn active" data-tab="events" onclick="switchTab('events')">Processed / Failed Events</button>
      <button class="tab-btn" data-tab="aggregate" onclick="switchTab('aggregate')">Aggregated Results</button>
    </div>

    <div id="tab-events">
      <div class="filters">
        <input type="text" id="statusFilter" placeholder="Filter by status: processed / rejected / failed_write / received">
        <button class="secondary" style="width:auto;margin:0;" onclick="loadEvents()">Refresh</button>
      </div>
      <table id="eventsTable">
        <thead><tr><th>ID</th><th>Source</th><th>Status</th><th>Received At</th><th>Payload</th><th>Error</th></tr></thead>
        <tbody></tbody>
      </table>
      <div id="eventsEmpty" class="empty-state" style="display:none;">No events yet — submit one on the left.</div>
    </div>

    <div id="tab-aggregate" style="display:none;">
      <div class="filters">
        <input type="text" id="aggClient" placeholder="client filter e.g. client_A">
        <input type="text" id="aggMetric" placeholder="metric filter e.g. value">
        <button class="secondary" style="width:auto;margin:0;" onclick="loadAggregate()">Refresh</button>
      </div>
      <div class="stat-grid" id="overallStats"></div>
      <table id="aggTable">
        <thead><tr><th>Client</th><th>Metric</th><th>Count</th><th>Total</th><th>Avg</th></tr></thead>
        <tbody></tbody>
      </table>
      <div id="aggEmpty" class="empty-state" style="display:none;">No aggregated data yet.</div>
    </div>
  </div>
</div>

<script>
let lastPayload = null;

function loadPreset(kind) {
  const presets = {
    clean: { source: "client_A", payload: {metric: "cpu_usage", amount: 42.5, timestamp: "2024-01-01T00:00:00Z"} },
    messy: { source: "client_A", payload: {metric: "value", amount: "1,200", timestamp: "01/02/2024"} },
    newclient: { source: "client_Z_new", payload: {metric_name: "orders", amt_paid: "$99.99", event_time: "2024-03-15", extra_field_no_one_expected: true} },
    broken: { source: "", payload: {amount: "abc"} },
  };
  const p = presets[kind];
  document.getElementById('source').value = p.source;
  document.getElementById('payload').value = JSON.stringify(p.payload, null, 2);
}

function showResult(data, ok) {
  const box = document.getElementById('resultBox');
  box.style.display = 'block';
  box.style.background = ok ? 'rgba(74,222,158,0.08)' : 'rgba(255,122,122,0.08)';
  box.style.borderColor = ok ? 'rgba(74,222,158,0.25)' : 'rgba(255,122,122,0.25)';
  box.style.color = ok ? '#4ade9e' : '#ff7a7a';
  box.textContent = JSON.stringify(data, null, 2);
}

async function submitEvent() {
  const source = document.getElementById('source').value;
  let payload;
  try {
    payload = JSON.parse(document.getElementById('payload').value);
  } catch (e) {
    showResult({error: "Invalid JSON in payload box"}, false);
    return;
  }
  const simulate_failure = document.getElementById('simulateFailure').checked;
  const body = { source, payload, simulate_failure };
  lastPayload = body;

  const res = await fetch('/api/ingest', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(body)
  });
  const data = await res.json();
  showResult(data, res.ok);
  loadEvents();
  loadAggregate();
}

async function retrySame() {
  if (!lastPayload) { showResult({error: "Submit an event first, then retry it."}, false); return; }
  const retryBody = {...lastPayload, simulate_failure: false};
  const res = await fetch('/api/ingest', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(retryBody)
  });
  const data = await res.json();
  showResult(data, res.ok);
  loadEvents();
  loadAggregate();
}

function switchTab(tab) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  document.getElementById('tab-events').style.display = tab === 'events' ? 'block' : 'none';
  document.getElementById('tab-aggregate').style.display = tab === 'aggregate' ? 'block' : 'none';
}

async function loadEvents() {
  const status = document.getElementById('statusFilter').value.trim();
  const url = status ? `/api/events?status=${encodeURIComponent(status)}` : '/api/events';
  const res = await fetch(url);
  const rows = await res.json();
  const tbody = document.querySelector('#eventsTable tbody');
  tbody.innerHTML = '';
  document.getElementById('eventsEmpty').style.display = rows.length ? 'none' : 'block';
  rows.forEach(r => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${r.id}</td>
      <td>${r.source || '-'}</td>
      <td><span class="badge ${r.status}">${r.status}</span></td>
      <td class="mono">${(r.received_at || '').replace('T',' ').slice(0,19)}</td>
      <td class="mono" title='${(r.payload||'').replace(/'/g, "&#39;")}'>${r.payload}</td>
      <td class="mono">${r.error || ''}</td>
    `;
    tbody.appendChild(tr);
  });
}

async function loadAggregate() {
  const client = document.getElementById('aggClient').value.trim();
  const metric = document.getElementById('aggMetric').value.trim();
  const params = new URLSearchParams();
  if (client) params.set('client', client);
  if (metric) params.set('metric', metric);
  const res = await fetch('/api/aggregate?' + params.toString());
  const data = await res.json();

  const overallDiv = document.getElementById('overallStats');
  overallDiv.innerHTML = `
    <div class="stat-card"><div class="num">${data.overall.count || 0}</div><div class="label">Total Events (deduped)</div></div>
    <div class="stat-card"><div class="num">${(data.overall.total || 0).toLocaleString()}</div><div class="label">Sum of Amount</div></div>
    <div class="stat-card"><div class="num">${data.breakdown.length}</div><div class="label">Client × Metric Groups</div></div>
  `;

  const tbody = document.querySelector('#aggTable tbody');
  tbody.innerHTML = '';
  document.getElementById('aggEmpty').style.display = data.breakdown.length ? 'none' : 'block';
  data.breakdown.forEach(r => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${r.client_id}</td>
      <td>${r.metric}</td>
      <td>${r.count}</td>
      <td>${(r.total || 0).toLocaleString()}</td>
      <td>${(r.avg || 0).toFixed(2)}</td>
    `;
    tbody.appendChild(tr);
  });
}

loadEvents();
loadAggregate();
</script>

</body>
</html>
